# 番茄钟悬浮时钟铺在出厂 Web 组合之上，那个组合里没有这一行。
# 宿主半现在不空了：`apply` 注册休息提醒用的只读路由 `/pomodoro/tip`（失败一律 204）。
# 客户端还没用它：浏览器入口 `./client` 里没有任何 fetch，「休息开始时拉一次」是 Task 5 的接线
# 工作。时钟本体仍在浏览器入口，它自己挂进整帧的
# `shell.overlay` 层。这一行的作用是让插件在 profile 里可寻址、可列出、可开关。
#
# 改宿主半（index.js）之后**必须重启宿主进程**：Node 按解析后的 URL 缓存 ESM 模块，而 DSH 的
# HMR 在本 profile 里 root 为空、不监听模块文件；插件管理器的 disable/enable 只重挂 loader
# entry，不会重新 import。不重启的症状很隐蔽——entry 是 active、没有报错，路由却一直 404。

- insert:
    - id: pomodoro-clock
      name: '@local/pomodoro-clock'
